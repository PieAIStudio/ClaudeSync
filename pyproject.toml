[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudesync"
version = "1.1.0"
description = "A safe, manual, cross-platform local session index sync tool for Claude."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "PieAI", email = "PIEAI@hotmail.com" }]
keywords = ["claude", "session", "sync", "desktop", "backup"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux"]

[project.scripts]
claudesync = "claude_sync.core:main"

[tool.setuptools]
packages = ["claude_sync"]
