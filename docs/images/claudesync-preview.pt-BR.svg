<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">ClaudeSync interface preview</title>
  <desc id="desc">A clean desktop window showing status, metrics, and an inline title conflict choice table.</desc>
  <rect width="1200" height="690" rx="20" fill="#f5f7fb"/>
  <rect x="26" y="22" width="1148" height="646" rx="16" fill="#fff" stroke="#d8deea"/>
  <text x="58" y="68" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">ClaudeSync</text>
  <text x="225" y="68" font-family="Arial, sans-serif" font-size="15" fill="#5e6b82">Sincronização local manual, clara e multiplataforma</text>
  <rect x="58" y="92" width="1084" height="78" rx="10" fill="#eef6ff" stroke="#b9d9ff"/>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0a5cad">Status: itens seguros prontos</text>
  <text x="80" y="148" font-family="Arial, sans-serif" font-size="13" fill="#5e6b82">Revise os títulos; somente Sincronizar grava índices locais</text>
  <g font-family="Arial, sans-serif">
    <rect x="58" y="188" width="255" height="74" rx="10" fill="#fff" stroke="#d8deea"/>
    <rect x="326" y="188" width="255" height="74" rx="10" fill="#fff" stroke="#d8deea"/>
    <rect x="594" y="188" width="255" height="74" rx="10" fill="#fff" stroke="#d8deea"/>
    <rect x="862" y="188" width="280" height="74" rx="10" fill="#fff" stroke="#d8deea"/>
    <text x="78" y="220" font-size="25" font-weight="700" fill="#172033">3</text><text x="78" y="244" font-size="12" fill="#5e6b82">Sessões para adicionar</text>
    <text x="346" y="220" font-size="25" font-weight="700" fill="#172033">2</text><text x="346" y="244" font-size="12" fill="#5e6b82">Títulos para atualizar</text>
    <text x="614" y="220" font-size="25" font-weight="700" fill="#b42318">1</text><text x="614" y="244" font-size="12" fill="#5e6b82">Escolhas de título</text>
    <text x="882" y="220" font-size="25" font-weight="700" fill="#172033">7</text><text x="882" y="244" font-size="12" fill="#5e6b82">Ignorados</text>
  </g>
  <rect x="58" y="282" width="1084" height="244" rx="10" fill="#fff" stroke="#d8deea"/>
  <text x="80" y="314" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Detalhes dos títulos (escolha conflitos aqui)</text>
  <line x1="78" y1="334" x2="1122" y2="334" stroke="#d8deea"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#5e6b82" font-weight="700">
    <text x="80" y="356">Status</text><text x="188" y="356">Sessão</text><text x="330" y="356">Títulos por conta</text><text x="560" y="356">Ação</text><text x="790" y="356">Ação</text><text x="930" y="356">Escolher</text>
  </g>
  <rect x="78" y="370" width="1044" height="50" rx="5" fill="#fff7ed"/>
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="80" y="400" fill="#b42318" font-weight="700">Precisa escolher</text><text x="188" y="400" fill="#172033">999d364b-174…</text><text x="330" y="400" fill="#172033">Plano de trabalho</text><text x="560" y="400" fill="#172033">Plano do projeto</text><text x="790" y="400" fill="#b42318">Vários títulos manuais</text>
    <circle cx="940" cy="395" r="7" fill="#fff" stroke="#0a5cad" stroke-width="2"/><circle cx="940" cy="395" r="3" fill="#0a5cad"/><text x="954" y="400" fill="#172033">Conta A</text>
    <circle cx="1015" cy="395" r="7" fill="#fff" stroke="#9aa5b8" stroke-width="2"/><text x="1029" y="400" fill="#172033">Conta B</text>
    <circle cx="1090" cy="395" r="7" fill="#fff" stroke="#9aa5b8" stroke-width="2"/><text x="1104" y="400" fill="#172033">Ignorar</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="80" y="450">Iguais</text><text x="188" y="450">d750f73a-8ef…</text><text x="330" y="450">Atualização do SwimmerParty</text><text x="560" y="450">Atualização do SwimmerParty</text><text x="790" y="450">Sem alteração</text>
    <text x="80" y="490">Pode unificar</text><text x="188" y="490">cb8eb5bf-eda…</text><text x="330" y="490">Avaliação de componentes interativos</text><text x="560" y="490">Avaliação de componentes interativos</text><text x="790" y="490">Limpar marca</text>
  </g>
  <rect x="58" y="548" width="1084" height="74" rx="10" fill="#f8fafc" stroke="#d8deea"/>
  <rect x="80" y="568" width="112" height="34" rx="7" fill="#fff" stroke="#9aa5b8"/><text x="96" y="590" font-family="Arial, sans-serif" font-size="13" fill="#172033">Verificar novamente</text>
  <rect x="202" y="568" width="128" height="34" rx="7" fill="#0a5cad"/><text x="220" y="590" font-family="Arial, sans-serif" font-size="13" fill="#fff">Sincronizar itens seguros</text>
  <rect x="342" y="568" width="164" height="34" rx="7" fill="#fff" stroke="#0a5cad"/><text x="358" y="590" font-family="Arial, sans-serif" font-size="13" fill="#0a5cad">Fechar Claude e sincronizar</text>
</svg>
